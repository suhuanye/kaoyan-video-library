<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176455">
  <meta name="description" content="考研数学视频考点导航，包含数二原有内容及数一数三专项。按章节查找数学大观讲解，一键跳到视频对应时间。手机和电脑均可使用。">
  <title>考研数学视频导航 · 数学大观</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <script src="./videos.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./" aria-label="返回首页"><span class="brand-mark">数</span><span>考研 · 数学视频导航</span></a>
    <span class="header-note">澄潇宇 · 数学大观</span>
  </header>
  <main>
    <section class="intro">
      <div class="eyebrow">把时间留给真正不会的地方</div>
      <h1>找到考点，<br class="mobile-break">直接听讲。</h1>
      <p class="intro-copy">按章节找，或搜一个关键词。点击时间，跳到对应的视频讲解。</p>
      <div class="search-wrap">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
        <label class="sr-only" for="search">搜索视频考点</label>
        <input id="search" type="search" placeholder="试试：导数定义、二重积分、特征方程…" autocomplete="off">
        <button id="clear" class="clear" type="button" hidden>清空</button>
      </div>
      <p class="library-stats" id="libraryStats"></p>
    </section>
    <div class="workspace">
      <aside class="chapter-panel">
        <div class="panel-label">章节目录 <span>CONTENTS</span></div>
        <nav id="chapters" aria-label="选择章节"></nav>
        <p class="nav-note">不用从头看。<br>卡在哪里，就从哪里开始。</p>
      </aside>
      <section class="results-panel" aria-label="视频列表">
        <div class="results-top">
          <div><p class="eyebrow" id="resultEyebrow">CHAPTER 01</p><h2 id="resultTitle"></h2></div>
          <div class="filters" role="group" aria-label="视频类型">
            <button type="button" data-kind="all" aria-pressed="true">全部</button>
            <button type="button" data-kind="point" aria-pressed="false">细分考点</button>
            <button type="button" data-kind="chapter" aria-pressed="false">章节整段</button>
          </div>
        </div>
        <p class="chapter-note" id="chapterNote" hidden></p>
        <p class="result-count" id="resultCount" role="status" aria-live="polite"></p>
        <div id="results"></div>
        <noscript>请启用浏览器的 JavaScript 以查看视频目录。</noscript>
        <p class="play-note">点击后在 B 站打开，时间区间供定位参考；视频会从起点继续播放。</p>
      </section>
    </div>
  </main>
  <footer><span>考研数学视频导航</span><span>视频版权归原作者及平台所有 · 本站仅提供目录与跳转</span></footer>
</body>
</html>
